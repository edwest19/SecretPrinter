# -----------------------------------------------------------------------------
# release.yml
#
# Written by Claude (Anthropic model, Claude Opus 5.5) at the direction of
# Edwin West, for the SecretPrinter project, 2026-10-04. Reviewed by a human
# before merge.
#
# Purpose:
#   Turns a version tag into a release: builds, tests, makes the release folder,
#   signs SecretPrinter's own files, checks every signature, zips the folder and
#   publishes it on GitHub (REQ-DIST-004, REQ-DIST-006).
#
# When it runs:
#   Only when a tag beginning with "v" is pushed, for example v0.1.0. Nothing
#   else starts it: not a push to a branch, not a pull request, not a button.
#
# The three jobs, and why they are separate:
#   build    Reads the repository and nothing more. Builds, runs every test
#            suite, runs the specification check, runs publish-release.ps1.
#   sign     The only job that can reach the signing account. It never checks
#            the repository out; it receives the folder the build job made. It
#            runs in the GitHub environment "release", which waits for a person
#            to approve it and accepts only "v" tags.
#   release  The only job that can write to the repository, and all it writes
#            is the GitHub Release. It receives the signed zip from the sign job.
#   A job gets the one permission its work needs, so a mistake or a compromised
#   step in one job cannot do another job's work.
#
# What stops a release:
#   - A test fails: the build job fails and nothing is signed.
#   - The tag does not match <Version> in Directory.Build.props, or CHANGELOG.md
#     has no entry for it: the build job fails (REQ-DIST-006).
#   - The specification check does not pass: the folder is still built and, if
#     a person approves, signed, so that a signed build can be examined. But no
#     GitHub Release is published. A release with an uncovered binding
#     requirement is not something this project puts its name to.
#   - Any .exe or .dll in the folder lacks a valid signature after signing: the
#     sign job fails.
#
# How it signs in to Azure:
#   By OpenID Connect. GitHub issues the sign job a short-lived token that says
#   which repository and which environment it is running in; Azure accepts it
#   only for this repository's "release" environment. No password, key or
#   client secret is stored anywhere. The three values named AZURE_* below are
#   identifiers, held as secrets of the "release" environment so that only the
#   sign job can read them.
#
# What is signed, and what is not:
#   SecretPrinter's own .exe and .dll files. The .NET runtime files in the
#   folder already carry Microsoft's signature and are left exactly as
#   Microsoft shipped them; the sign job checks that they do.
#
# Actions used, each pinned to an exact commit so that a later change to an
# action cannot alter a release unnoticed. None of them ends up in a release.
#   actions/checkout                 v7.0.1   reads the repository
#   actions/setup-dotnet             v6.0.0   installs the SDK global.json names
#   actions/upload-artifact          v7.0.1   passes files between jobs
#   actions/download-artifact        v8.0.1   passes files between jobs
#   Azure/login                      v3.1.0   signs in to Azure by OpenID Connect
#   Azure/artifact-signing-action    v2.0.0   Microsoft's signing action. At run
#                                             time it downloads Microsoft's
#                                             signing tools, which add the
#                                             signatures and are not shipped.
#
# What this workflow has NOT yet shown:
#   Its first run, on 2026-10-04 for the tag v0.1.0-rc.1, failed in the build
#   job at "Check the specification" and never reached the sign job; see the
#   comment at the end of that step, and CHANGELOG.md. So the sign job has
#   still never run. Whether the Azure sign-in is accepted, what name the
#   signing certificate carries, and whether a job with only "id-token: write"
#   can fetch another job's files are all still to be learned. The
#   certificate's subject is printed and is not yet compared with an expected
#   value, because that value has not been measured.
# -----------------------------------------------------------------------------

name: Release

on:
  push:
    tags: [ 'v*' ]

# Nothing by default. Each job below asks for exactly what it needs.
permissions: {}

# One run for each tag, and never cancelled part-way: a half-made release is
# worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and make the release folder
    # Windows, for the reason ci.yml gives: the product is a Windows service.
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      specification: ${{ steps.specification.outputs.result }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job only reads. The token is not kept for later steps to use.
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Check the tag against the version and the changelog
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # The tag, for example v0.1.0 or v0.1.0-rc.1.
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') {
              throw "The tag '$tag' is not 'v' followed by a version such as 0.1.0 or 0.1.0-rc.1."
          }
          $version = $Matches[1]

          # The version every assembly is stamped with. One place holds it.
          [xml] $properties = Get-Content -LiteralPath 'Directory.Build.props' -Raw
          $declared = @($properties.Project.PropertyGroup |
                        ForEach-Object { $_.Version } |
                        Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($declared.Count -ne 1) {
              throw "Directory.Build.props must declare <Version> exactly once; found $($declared.Count)."
          }
          if ($declared[0] -cne $version) {
              throw "The tag says $version and Directory.Build.props says $($declared[0]). " +
                    "A release is a tagged commit whose code carries the tag's version (REQ-DIST-006)."
          }

          # The changelog entry, which becomes the release notes.
          $lines = @(Get-Content -LiteralPath 'CHANGELOG.md')
          $heading = '^## \[' + [regex]::Escape($version) + '\] - \d{4}-\d{2}-\d{2}\s*$'
          $starts = @(0..($lines.Count - 1) | Where-Object { $lines[$_] -cmatch $heading })
          if ($starts.Count -ne 1) {
              throw "CHANGELOG.md must have exactly one heading '## [$version] - YYYY-MM-DD'; " +
                    "found $($starts.Count). Every release has a changelog entry (REQ-DIST-006)."
          }
          $start = $starts[0] + 1
          $end = $lines.Count
          for ($i = $start; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -cmatch '^## \[') { $end = $i; break }
          }
          $notes = @()
          if ($end -gt $start) { $notes = @($lines[$start..($end - 1)]) }
          if (@($notes | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count -eq 0) {
              throw "The CHANGELOG.md entry for $version is empty."
          }

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $notes | Set-Content -LiteralPath 'artifacts/release-notes.md' -Encoding utf8

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Tag $tag is version $version. Directory.Build.props and CHANGELOG.md agree."

      - name: Build
        run: dotnet build --configuration Release

      - name: Run test suites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $suites = Get-ChildItem -Path tests -Directory -Filter '*.Tests' |
                    Sort-Object Name

          if ($suites.Count -eq 0) {
              throw "No test suites found under tests/. A run that tests nothing must never " +
                    "look like a run that tests everything."
          }

          foreach ($suite in $suites) {
              $results = Join-Path 'artifacts' "$($suite.Name).txt"

              Write-Host "--- $($suite.Name) ---"
              dotnet run --project $suite.FullName --configuration Release --no-build `
                  -- --results $results

              if ($LASTEXITCODE -ne 0) {
                  throw "$($suite.Name) failed. Nothing is signed or released from a build with a failing test."
              }

              if (-not (Test-Path $results)) {
                  throw "$($suite.Name) reported success but wrote no results file at $results."
              }
          }

      - name: Check the specification
        id: specification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $suites = Get-ChildItem -Path tests -Directory -Filter '*.Tests'
          $results = Get-ChildItem -Path artifacts -Filter '*.Tests.txt' | Sort-Object Name

          if ($results.Count -ne $suites.Count) {
              throw "Expected $($suites.Count) results file(s) but found $($results.Count). " +
                    "Every suite must contribute one."
          }

          $resultArgs = $results | ForEach-Object { '--test-results', $_.FullName }

          dotnet run --project tools/SecretPrinter.SpecCheck --configuration Release --no-build -- `
              --readme README.md `
              --evidence docs/verification.md `
              @resultArgs `
              --write-matrix artifacts/coverage-matrix.md `
              --search .

          $checkExit = $LASTEXITCODE

          if (Test-Path artifacts/coverage-matrix.md) {
              Get-Content artifacts/coverage-matrix.md |
                  Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

          # Recorded, not thrown. The release job reads this and publishes
          # nothing unless it says "pass". See "What stops a release" above.
          if ($checkExit -eq 0) {
              "result=pass" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              Write-Host "The specification check passed."
          }
          else {
              "result=not-passed" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
              Write-Host "::warning::The specification check did not pass (exit code $checkExit). The folder will be built and may be signed for examination, but no GitHub Release will be published."
          }

          # GitHub ends a pwsh step with the exit code of the last program the
          # step ran, whatever the script did afterwards. Here that program is
          # SpecCheck, whose non-zero code has just been recorded as a result
          # and is not a failure of this step. So the step ends with 0 itself.
          # Without this line the first run, on 2026-10-04, stopped here.
          exit 0

      - name: Make the release folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Outside the repository, as publish-release.ps1 requires.
          $folder = Join-Path $env:RUNNER_TEMP 'SecretPrinter'
          ./publish-release.ps1 -OutputDirectory $folder

          # A list of every file with its SHA-256, taken before signing, so the
          # sign job can show that it changed SecretPrinter's files and no others.
          Get-ChildItem -LiteralPath $folder -Recurse -File | Sort-Object FullName | ForEach-Object {
              '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash,
                            $_.FullName.Substring($folder.Length + 1)
          } | Set-Content -LiteralPath 'artifacts/before-signing.sha256' -Encoding utf8

      - name: Hand the unsigned folder to the sign job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-folder
          path: ${{ runner.temp }}/SecretPrinter/
          if-no-files-found: error
          retention-days: 7

      - name: Keep the test results, the coverage matrix and the release notes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-record
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

  sign:
    name: Sign SecretPrinter's files
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    # Waits for approval, accepts only "v" tags, and is the only place the
    # three AZURE_* values can be read.
    environment: release
    permissions:
      # To ask GitHub for the OpenID Connect token Azure accepts. Nothing else.
      id-token: write

    steps:
      - name: Receive the unsigned folder
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-folder
          path: ${{ runner.temp }}/SecretPrinter

      - name: Receive the build record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-record
          path: ${{ runner.temp }}/build-record

      - name: List what will be signed, and check the rest is already signed
        id: list
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'SecretPrinter'

          $signable = @(Get-ChildItem -LiteralPath $folder -Recurse -File |
                        Where-Object { $_.Extension -in '.exe', '.dll' } | Sort-Object FullName)
          $ours   = @($signable | Where-Object { $_.Name -like 'SecretPrinter*' })
          $others = @($signable | Where-Object { $_.Name -notlike 'SecretPrinter*' })

          if ($ours.Count -eq 0) {
              throw "No SecretPrinter .exe or .dll found in $folder. There is nothing to sign."
          }

          # Before signing: ours carry no signature, and every other .exe and
          # .dll carries a valid one. Anything else means the folder is not
          # what publish-release.ps1 makes, and signing it would hide that.
          foreach ($file in $ours) {
              $status = (Get-AuthenticodeSignature -LiteralPath $file.FullName).Status
              if ($status -ne 'NotSigned') {
                  throw "$($file.Name) arrived with signature status '$status'. It should arrive unsigned."
              }
          }
          foreach ($file in $others) {
              $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
              if ($signature.Status -ne 'Valid') {
                  throw "$($file.Name) is not one of SecretPrinter's files and its signature status is " +
                        "'$($signature.Status)'. Every file that is not ours must arrive validly signed."
              }
          }

          Write-Host "To be signed ($($ours.Count)):"
          $ours | ForEach-Object { Write-Host "  $($_.Name)" }
          Write-Host "Already validly signed by their publishers: $($others.Count) file(s)."

          # A multi-line output, in the form GitHub documents for one.
          $marker = "END_OF_FILES_$([guid]::NewGuid().ToString('N'))"
          @("files<<$marker") + @($ours | ForEach-Object { $_.FullName }) + @($marker) |
              Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Sign in to Azure
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          # The signing account, its region's endpoint and the certificate
          # profile. They are names, not credentials, and are written here so
          # that anyone can see which account signs a SecretPrinter release.
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: edwest19
          certificate-profile-name: CodeSigning-Apps
          files: ${{ steps.list.outputs.files }}
          file-digest: SHA256
          # A timestamp from Microsoft's service. The signing certificates are
          # short-lived; the timestamp is what lets a signature stay valid
          # after the certificate that made it has expired.
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check every signature
        id: check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'SecretPrinter'

          $signable = @(Get-ChildItem -LiteralPath $folder -Recurse -File |
                        Where-Object { $_.Extension -in '.exe', '.dll' } | Sort-Object FullName)

          $subjects = @{}
          foreach ($file in $signable) {
              $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
              if ($signature.Status -ne 'Valid') {
                  throw "$($file.Name): signature status '$($signature.Status)' after signing. " +
                        "Every .exe and .dll in a release carries a valid signature (REQ-DIST-004)."
              }
              if ($file.Name -like 'SecretPrinter*') {
                  if ($null -eq $signature.TimeStamperCertificate) {
                      throw "$($file.Name) is signed but carries no timestamp, so its signature " +
                            "would stop being valid when the signing certificate expires."
                  }
                  $subjects[$signature.SignerCertificate.Subject] = $true
              }
          }

          if ($subjects.Count -ne 1) {
              throw "SecretPrinter's files are signed under $($subjects.Count) different names: " +
                    ($subjects.Keys -join ' | ')
          }
          $subject = @($subjects.Keys)[0]

          # Which files changed while this job had them. Only ours may have.
          $before = @{}
          Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'build-record/before-signing.sha256') |
              ForEach-Object { $hash, $name = $_ -split '  ', 2; $before[$name] = $hash }

          $all = @(Get-ChildItem -LiteralPath $folder -Recurse -File)
          if ($all.Count -ne $before.Count) {
              throw "The folder held $($before.Count) file(s) when it was built and holds $($all.Count) now."
          }
          $changed = @()
          foreach ($file in $all) {
              $name = $file.FullName.Substring($folder.Length + 1)
              if (-not $before.ContainsKey($name)) {
                  throw "$name was not in the folder when it was built."
              }
              if ((Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash -ne $before[$name]) {
                  $changed += $file
              }
          }
          $unexpected = @($changed | Where-Object {
              $_.Name -notlike 'SecretPrinter*' -or $_.Extension -notin '.exe', '.dll' })
          if ($unexpected.Count -gt 0) {
              throw "Files other than SecretPrinter's own .exe and .dll changed during signing: " +
                    (($unexpected | ForEach-Object Name) -join ', ')
          }

          Write-Host "All $($signable.Count) .exe and .dll files carry a valid signature."
          Write-Host "SecretPrinter's files are signed by: $subject"
          Write-Host "Files changed by signing: $($changed.Count). No other file changed."

          "subject=$subject" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "signed=$($changed.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "files=$($all.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Zip the folder and record its SHA-256
        id: zip
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SPECIFICATION: ${{ needs.build.outputs.specification }}
          SUBJECT: ${{ steps.check.outputs.subject }}
          SIGNED: ${{ steps.check.outputs.signed }}
          FILES: ${{ steps.check.outputs.files }}
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'SecretPrinter'
          $out = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $zipName = "SecretPrinter-$($env:VERSION)-win-x64.zip"
          $zip = Join-Path $out $zipName
          Compress-Archive -Path (Join-Path $folder '*') -DestinationPath $zip

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
          "$hash  $zipName" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii

          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'build-record/release-notes.md') -Destination $out

          $summary = @(
              "## SecretPrinter $($env:VERSION)",
              "",
              "| | |",
              "| --- | --- |",
              "| Tag | ``$($env:GITHUB_REF_NAME)`` |",
              "| Commit | ``$($env:GITHUB_SHA)`` |",
              "| Files in the folder | $($env:FILES) |",
              "| Files signed in this run | $($env:SIGNED) |",
              "| Signed by | ``$($env:SUBJECT)`` |",
              "| Zip | ``$zipName`` |",
              "| SHA-256 of the zip | ``$hash`` |",
              "| Specification check | $($env:SPECIFICATION) |",
              ""
          )
          if ($env:SPECIFICATION -ne 'pass') {
              $summary += "**No GitHub Release is published from this run.** The specification check did not pass, so the signed zip is kept with this run for examination and nowhere else."
          }
          $summary | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Hand the signed zip to the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          # Short, because anyone signed in to GitHub can download a run's
          # files. A published release has its own copy; a trial run's signed
          # zip should not linger.
          retention-days: 7

  release:
    name: Publish the GitHub Release
    needs: [ build, sign ]
    # Only a build whose specification check passed is published.
    if: needs.build.outputs.specification == 'pass'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      # To create the release for the tag. Nothing else.
      contents: write

    steps:
      - name: Receive the signed zip
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release
          path: release

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $zipName = "SecretPrinter-$($env:VERSION)-win-x64.zip"
          $zip = Join-Path 'release' $zipName
          $recorded = (Get-Content -LiteralPath "$zip.sha256" -TotalCount 1) -split '  ', 2

          # The zip that arrived is the zip the sign job hashed.
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
          if ($hash -ne $recorded[0]) {
              throw "The zip's SHA-256 is $hash and the sign job recorded $($recorded[0])."
          }

          # A version with a hyphen, such as 0.1.0-rc.1, is a pre-release.
          $arguments = @(
              'release', 'create', $env:GITHUB_REF_NAME,
              $zip, "$zip.sha256",
              '--title', "SecretPrinter $($env:VERSION)",
              '--notes-file', 'release/release-notes.md',
              '--verify-tag'
          )
          if ($env:VERSION -match '-') { $arguments += '--prerelease' }

          gh @arguments
          if ($LASTEXITCODE -ne 0) {
              throw "gh release create failed with exit code $LASTEXITCODE."
          }
